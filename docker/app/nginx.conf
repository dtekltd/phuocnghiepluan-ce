server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Flutter web output is not content-hashed (main.dart.js, assets/*.json, ...),
    # so code and data must always be revalidated or browsers keep old releases.
    location ~* \.(html|js|mjs|css|wasm|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA fallback for Flutter routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
